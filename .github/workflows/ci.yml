# Kontroly bez přístupu do GCP: testy, statický build, kontrola, že na web nejde nic interního, a Terraform.
# Běží i pro PR z forků (repozitář je veřejný), proto tu nejsou žádná tajemství ani přihlášení do cloudu.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Instalace
        run: npm ci --no-audit --no-fund

      - name: Testy
        run: npm test

      # Ukázky z bucketu tu nejsou (bez přístupu do GCP), chybějící se jen ohlásí.
      - name: Statický build
        run: npm run build:static
        env:
          ALLOW_MISSING_MEDIA: "1"

      - name: Nic interního na webu
        run: npm run check:static

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - name: Formát
        run: terraform fmt -check -recursive

      - name: Validace (prod)
        working-directory: infra/envs/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate
